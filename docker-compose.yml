services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: trendsfast
      POSTGRES_USER: trendsfast
      POSTGRES_PASSWORD: trendsfast_local
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trendsfast -d trendsfast"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - trendsfast_postgres:/var/lib/postgresql/data

volumes:
  trendsfast_postgres:
