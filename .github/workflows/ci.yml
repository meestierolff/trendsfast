name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  APP_URL: http://127.0.0.1:3000
  DATABASE_URL: postgresql://trendsfast:trendsfast_ci@127.0.0.1:5432/trendsfast
  DIRECT_DATABASE_URL: postgresql://trendsfast:trendsfast_ci@127.0.0.1:5432/trendsfast
  PROVIDER_CREDENTIAL_MODE: fixture
  PUBLIC_SCAN_PROCESSING: inline
  PUBLIC_SCAN_DAILY_LIMIT: "20"
  SCAN_RETENTION_DAYS: "90"
  OPS_TOKEN: ci-only-ops-token-at-least-32-characters
  SESSION_SECRET: ci-only-session-secret-at-least-32-chars
  API_KEY_PEPPER: ci-only-api-key-pepper-at-least-32-chars
  BILLING_ENABLED: "false"
  STRIPE_MODE: test
  DATAFAST_ENABLED: "false"
  RUN_DATABASE_INTEGRATION: "1"

jobs:
  verify:
    name: Lint, types, tests, migration, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trendsfast
          POSTGRES_USER: trendsfast
          POSTGRES_PASSWORD: trendsfast_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trendsfast -d trendsfast"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check documentation formatting
        run: pnpm exec prettier --check "*.md" "docs/**/*.md" ".github/**/*.{md,yml,yaml}"

      - name: Replay migrations from zero
        run: pnpm db:migrate

      - name: Seed deterministic fixture data
        run: pnpm db:seed

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and contract tests
        run: pnpm test

      - name: Production build
        env:
          NODE_ENV: production
        run: pnpm build

  browser:
    name: Critical browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trendsfast
          POSTGRES_USER: trendsfast
          POSTGRES_PASSWORD: trendsfast_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trendsfast -d trendsfast"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare database
        run: pnpm db:migrate && pnpm db:seed

      - name: Install Chromium
        run: pnpm --filter @trendsfast/web exec playwright install --with-deps chromium

      - name: Run critical browser flows
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
